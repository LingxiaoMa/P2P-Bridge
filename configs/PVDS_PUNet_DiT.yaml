data:
  data_dir: data/objects/
  dataset: PUNet
  augment: true
  use_rgb_features: false
  workers: 4
  npoints: 2048
diffusion:
  timesteps: 1000
  sampling_timesteps: 10
  objective: pred_noise
  schedule: linear
  sampling_strategy: DDPM
  loss_type: mse
  beta_start: 1.e-4
  beta_end: 0.02
  t0: 1.e-4
  T: 1.0
  ot_ode: false
  consistency:
    enabled: false
    lambda_cons: 0.1
    warmup_steps: 5000
    use_ema_target: true
model:
  type: DiT
  ema: true
  in_dim: 3
  extra_feature_channels: 0
  out_dim: 3
  time_embed_dim: 64
  dropout: 0.0
  EMA:
    decay: 0.999
  DiT:
    num_tokens: 128
    token_dim: 384
    num_neighbors: 32
    num_layers: 6
    num_heads: 6
    k_interp: 3
training:
  optimizer:
    type: AdamW
    lr: 3.e-4
    beta1: 0.9
    beta2: 0.999
    weight_decay: 1.0e-05
  scheduler:
    type: constant
    lr_gamma: 0.999
  grad_clip:
    enabled: true
    value: 1.0
  bs: 32
  overfit: false
  amp: true
  steps: 450_000
  accumulation_steps: 1
  log_interval: 10
  save_interval: 10000
  viz_interval: 10000
  seed: 42
sampling:
  bs: 32
  num_iter: 8
